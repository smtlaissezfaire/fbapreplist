<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} | {{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page.title | escape }} | {{ site.title | escape }}">
<meta property="og:description" content="{{ page.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.url }}/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="FBA Prep List, a directory of US Amazon FBA prep centers">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | escape }} | {{ site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | escape }}">
<meta name="twitter:image" content="{{ site.url }}/assets/og.png">
<meta name="theme-color" content="#14233a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/site.css">
{% if page.noindex %}
<meta name="robots" content="noindex">
{% endif %}
{% if page.json_ld %}
<script type="application/ld+json">{{ page.json_ld }}</script>
{% elsif page.crumbs %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
{% for crumb in page.crumbs %}
{"@type":"ListItem","position":{{ forloop.index }},"name":{{ crumb.label | jsonify }},"item":{{ crumb.url | absolute_url | jsonify }}}{% unless forloop.last %},{% endunless %}
{% endfor %}
]}
</script>
{% endif %}
